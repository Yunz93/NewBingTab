<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新的一页</title>
  <link rel="icon" href="src/icon48.png" sizes="48x48">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="search-panel" aria-label="新标签页搜索面板">
      <p class="eyebrow">New Bing Tab</p>
      <h1 class="panel-title">打开新标签页，直接开始搜索</h1>
      <form id="search-form" class="search-form" novalidate>
        <label class="sr-only" for="search-engine">选择搜索引擎</label>
        <select id="search-engine" class="search-select" title="选择搜索引擎">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
          <option value="https://www.baidu.com/s?wd=">Baidu</option>
        </select>

        <label class="sr-only" for="search-input">搜索内容</label>
        <input
          id="search-input"
          class="search-input"
          type="text"
          inputmode="search"
          autocomplete="off"
          placeholder="搜点什么吧"
        >

        <button type="submit" class="search-button" id="search-button">搜索</button>
      </form>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
