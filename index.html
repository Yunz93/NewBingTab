<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新的一页</title>
  <link rel="icon" href="src/icon48.png" sizes="48x48">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="search-panel" aria-label="新标签页搜索面板">
      <form id="search-form" class="search-form" novalidate>
        <div class="search-engine" id="search-engine" data-value="https://www.google.com/search?q=">
          <label class="sr-only" for="search-engine-toggle">选择搜索引擎</label>
          <button
            type="button"
            id="search-engine-toggle"
            class="search-select search-select-toggle"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="search-engine-menu"
          >
            <span class="search-select-label" id="search-engine-label">Google</span>
            <span class="search-select-icon" aria-hidden="true"></span>
          </button>
          <div class="search-select-menu" id="search-engine-menu" role="listbox" hidden>
            <button
              type="button"
              class="search-select-option is-selected"
              role="option"
              aria-selected="true"
              data-label="Google"
              data-value="https://www.google.com/search?q="
            >
              <span class="search-select-check" aria-hidden="true">✓</span>
              <span class="search-select-option-label">Google</span>
            </button>
            <button
              type="button"
              class="search-select-option"
              role="option"
              aria-selected="false"
              data-label="Bing"
              data-value="https://www.bing.com/search?q="
            >
              <span class="search-select-check" aria-hidden="true">✓</span>
              <span class="search-select-option-label">Bing</span>
            </button>
            <button
              type="button"
              class="search-select-option"
              role="option"
              aria-selected="false"
              data-label="Baidu"
              data-value="https://www.baidu.com/s?wd="
            >
              <span class="search-select-check" aria-hidden="true">✓</span>
              <span class="search-select-option-label">Baidu</span>
            </button>
          </div>
        </div>

        <label class="sr-only" for="search-input">搜索内容</label>
        <input
          id="search-input"
          class="search-input"
          type="text"
          inputmode="search"
          autocomplete="off"
          placeholder="搜点什么吧"
        >

        <button type="submit" class="search-button" id="search-button">Search</button>
      </form>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
